<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>江戸和時計（不定時法）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">
    <canvas id="clock"></canvas>
    <section id="info-panel" class="panel panel-flip" aria-label="データ表示" role="button" tabindex="0" aria-pressed="false">
      <div class="panel-inner">
        <div class="panel-face panel-front">
          <div class="row">
              <div class="label" data-i18n="label.datetime">年月日・時刻</div>
            <div id="datetime" class="value">—</div>
          </div>
          <div class="row">
              <div class="label" data-i18n="label.sekki">24節気</div>
            <div id="sekki" class="value">—</div>
          </div>
          <div class="row">
              <div class="label" data-i18n="label.timezone">タイムゾーン</div>
            <div id="timezone" class="value">—</div>
          </div>
            <div class="panel-hint" data-i18n="hint.tapMenu">タップでメニュー</div>
        </div>
        <div class="panel-face panel-back" aria-label="コピーライト">
          <div id="panel-back-home" class="panel-view is-active">
            <div class="row">
                <div class="label" data-i18n="label.version">バージョン</div>
              <div id="app-version" class="value">1.0.0</div>
            </div>
            <div class="row">
              <div class="label" data-i18n="label.copyright">著作権</div>
              <div class="value">© 2026 Anaheim Technology Inc All rights reserved.</div>
            </div>
            <div class="row">
              <div class="label" data-i18n="label.appLicense">アプリ本体ライセンス</div>
              <div class="value" data-i18n="value.proprietary">プロプライエタリ（All rights reserved）</div>
            </div>
            <div class="menu-list">
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-settings" data-i18n="menu.settings">設定</button>
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-license" data-i18n="menu.oss">オープンソースライセンス</button>
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-terms" data-i18n="menu.terms">利用規約</button>
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-privacy" data-i18n="menu.privacy">プライバシーポリシー</button>
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-tokushoho" data-i18n="menu.tokushoho">特定商取引法の表示</button>
              <button type="button" class="menu-btn no-flip panel-close" data-i18n="menu.backToFront">表へ戻る</button>
            </div>
          </div>

          <div id="panel-back-settings" class="panel-view">
            <div class="row row-setting no-flip">
              <div class="label" data-i18n="setting.dayNight">昼夜区分け</div>
              <div class="value setting-value">
                <label class="ios-switch no-flip" for="show-day-night">
                  <input id="show-day-night" type="checkbox" class="no-flip" checked>
                  <span class="ios-slider"></span>
                </label>
                <span id="show-day-night-label">表示</span>
              </div>
            </div>
            <div class="row row-setting no-flip">
              <label class="label" for="language-select" data-i18n="setting.language">言語</label>
              <div class="value">
                <select id="language-select" class="no-flip">
                  <option value="auto">Auto</option>
                  <option value="ja">日本語</option>
                  <option value="en">English</option>
                  <option value="fr">Français</option>
                  <option value="de">Deutsch</option>
                </select>
              </div>
            </div>
            <div class="panel-actions">
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-home" data-i18n="menu.back">戻る</button>
            </div>
          </div>

          <div id="panel-back-license" class="panel-view">
            <div class="legal-title" data-i18n="menu.oss">オープンソースライセンス</div>
            <div id="legal-oss" class="legal-scroll legal-content">
              読み込み中...
            </div>
            <div class="panel-actions">
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-home" data-i18n="menu.back">戻る</button>
            </div>
          </div>

          <div id="panel-back-terms" class="panel-view">
            <div class="legal-title" data-i18n="menu.terms">利用規約</div>
            <div id="legal-terms" class="legal-scroll legal-content">
              読み込み中...
            </div>
            <div class="panel-actions">
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-home" data-i18n="menu.back">戻る</button>
            </div>
          </div>

          <div id="panel-back-privacy" class="panel-view">
            <div class="legal-title" data-i18n="menu.privacy">プライバシーポリシー</div>
            <div id="legal-privacy" class="legal-scroll legal-content">
              読み込み中...
            </div>
            <div class="panel-actions">
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-home" data-i18n="menu.back">戻る</button>
            </div>
          </div>

          <div id="panel-back-tokushoho" class="panel-view">
            <div class="legal-title" data-i18n="menu.tokushoho">特定商取引法の表示</div>
            <div id="legal-tokushoho" class="legal-scroll legal-content">
              読み込み中...
            </div>
            <div class="panel-actions">
              <button type="button" class="menu-btn no-flip" data-panel-view="panel-back-home" data-i18n="menu.back">戻る</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <script src="utils/datetime.js"></script>
  <script src="utils/taiyou.js"></script>
  <script src="domain/24terms.js"></script>
  <script src="core/consts-loader.js"></script>
  <script src="core/config-loader.js"></script>
  <script src="core/wadokei.js"></script>
</body>

</html>

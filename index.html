<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>江戸和時計（不定時法）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap">
  <style>
    body {
      font-family: system-ui, "Yu Mincho", serif;
      margin: 0;
      background: #f6f3ee;
    }

    .wrap {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }

    canvas {
      display: block;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    #clock {
      width: 100%;
      height: auto;
      max-width: 600px;
      /* PC では大きく、モバイルでは縮む */
      min-width: 300px;
      /* モバイルで小さくなりすぎないように */
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      align-items: start;
      padding: 8px 0;
    }

    .label {
      color: #6b4b2b;
    }

    .value {
      font-variant-numeric: tabular-nums;
    }

    /* --- index.html の <style> 内に追加・修正 --- */

    .wrap {
      max-width: 900px;
      /* 横並び用に少し広げる */
      margin: 24px auto;
      padding: 0 16px;
      /* 横向き時のための Flex 設定 */
      display: flex;
      flex-direction: column;
      /* 基本は縦並び */
      gap: 20px;
      align-items: center;
    }

    /* 横向き（Landscape）になった時の処理 */
    @media (orientation: landscape) {
      .wrap {
        flex-direction: row;
        /* 横並びに変更 */
        max-width: 100%;
        /* 横幅を画面いっぱいに */
        justify-content: center;
        padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        /* 島・ノッチ回避 */
        margin: 0;
        height: 100vh;
        /* 画面の高さに合わせる */
      }

      canvas#clock {
        max-width: 45vw;
        /* 画面幅の45%程度に抑える */
        margin: 0;
        /* 余計なマージンを消す */
      }

      .panel {
        flex: 1;
        /* 残りのスペースをパネルが埋める */
        max-width: 400px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <canvas id="clock"></canvas>

    <section class="panel" aria-label="データ表示">
      <div class="row">
        <div class="label">年月日・時刻</div>
        <div id="datetime" class="value">—</div>
      </div>
      <div class="row">
        <div class="label">24節気</div>
        <div id="sekki" class="value">—</div>
      </div>
      <div class="row">
        <div class="label">タイムゾーン</div>
        <div id="timezone" class="value">—</div>
      </div>
    </section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <script src="utils/datetime.js"></script>
  <script src="utils/taiyou.js"></script>
  <script src="domain/24terms.js"></script>
  <script src="core/consts-loader.js"></script>
  <script src="core/config-loader.js"></script>
  <script src="core/wadokei.js"></script>
</body>

</html>
